<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AIxMUSIC DUAL BRAIN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;background:#050510;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
.app{width:100%;max-width:420px;background:linear-gradient(180deg,rgba(139,92,246,.2),rgba(0,0,0,.8));border:1.5px solid #8b5cf6;border-radius:28px;padding:18px;box-shadow:0 0 80px rgba(139,92,246,.5);text-align:center}
.genres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.g{padding:9px 2px;border:1px solid #8b5cf6;border-radius:10px;background:rgba(139,92,246,.12);color:#fff;font-weight:700;font-size:10px;cursor:pointer}.g.active{background:#8b5cf6;box-shadow:0 0 12px #8b5cf6}
.bars{display:flex;gap:3px;justify-content:center;height:44px;align-items:center;margin:12px 0}.bar{width:5px;background:linear-gradient(#8b5cf6,#22d3ee);border-radius:4px;transition:height.08s}
input, #chatInput{width:100%;background:#111;border:1px solid #333;border-radius:12px;padding:11px;color:#fff;margin:6px 0;font-size:13px}
button.main{width:100%;background:#8b5cf6;border:none;color:#fff;padding:14px;border-radius:99px;font-weight:800;box-shadow:0 0 24px #8b5cf6;cursor:pointer}
.brain{display:flex;gap:8px;margin:8px 0}.brain div{flex:1;border-radius:12px;padding:8px;font-size:10px;border:1px solid #222} #brain1{border-color:#8b5cf6;background:rgba(139,92,246,.1)} #brain2{border-color:#22d3ee;background:rgba(34,211,238,.08);text-align:left;max-height:110px;overflow:auto}
#chatBox{font-size:12px;line-height:1.4;white-space:pre-wrap}
</style>
</head>
<body>
<div class="app">
  <img src="/logo.png" style="width:72px;border-radius:18px;box-shadow:0 0 20px #8b5cf6">
  <h2 style="margin:6px 0;letter-spacing:2px">AIxMUSIC DUAL BRAIN</h2>
  <div class="brain"><div id="brain1">🧠 CONDUCTOR<br><small id="b1">Idle</small></div><div id="brain2">⚡ CREATIVE<br><div id="chatBox">سلام! من مغز خلاقتم 😎 هرچی میخوای از آهنگ بپرس!</div></div></div>
  <input id="prompt" value="hypnotic deep house night drive">
  <div class="genres" id="genres"></div>
  <div class="bars" id="bars"></div>
  <button class="main" id="btn" onclick="toggle()">▶ BUFFER & PLAY</button>
  <div style="display:flex;gap:6px;margin-top:8px"><input id="chatInput" placeholder="به مغز خلاق بگو: darker, more funky..." onkeydown="if(event.key==='Enter') askCreative()"><button onclick="askCreative()" style="background:#22d3ee;border:none;border-radius:10px;padding:0 14px;color:#000;font-weight:800">SEND</button></div>
  <div id="status" style="font-size:10px;opacity:.6;margin-top:8px;font-family:monospace">Dual brain ready</div>
  <div id="debug" style="display:none;text-align:left;background:#000;border:1px solid #333;border-radius:10px;padding:6px;margin-top:8px;height:120px;overflow:auto;font-family:monospace;font-size:9px"></div>
  <small onclick="document.getElementById('debug').style.display=document.getElementById('debug').style.display==='block'?'none':'block'" style="opacity:.4;cursor:pointer">🐞 debug</small>
</div>
<script>
const GENRES=['Deep House','Rock','Metal','Classic','Jazz','Blues','Lo-Fi','Trap'];
let GENRE='Deep House', ctx, masterGain, playing=false, timer, nextNote=0, step=0, logs=[];
let session=null, sections=[], sectionIdx=0, barCount=0;
function log(m){ logs.push(`[${new Date().toLocaleTimeString()}] ${m}`); if(logs.length>80) logs.shift(); document.getElementById('debug').innerText=logs.join('\n'); document.getElementById('b1').innerText=m.slice(0,32); }
const gDiv=document.getElementById('genres'); GENRES.forEach(g=>{ let b=document.createElement('button'); b.className='g'+(g===GENRE?' active':''); b.innerText=g; b.onclick=()=>{GENRE=g; document.querySelectorAll('.g').forEach(x=>x.classList.remove('active')); b.classList.add('active'); session=null; sections=[]; log('Genre '+g+' reset');}; gDiv.appendChild(b); });
const barsDiv=document.getElementById('bars'); for(let i=0;i<20;i++){let d=document.createElement('div'); d.className='bar'; d.style.height='6px'; barsDiv.appendChild(d);} const bars=document.querySelectorAll('.bar');
function rnd(a,b){return Math.random()*(b-a)+a}
function initAudio(){ if(!ctx){ ctx=new(window.AudioContext||window.webkitAudioContext)(); masterGain=ctx.createGain(); masterGain.gain.value=0.85; masterGain.connect(ctx.destination);} if(ctx.state==='suspended') ctx.resume(); }
function kick(t){ let o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(42,t+0.11); g.gain.setValueAtTime(0.95,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.5); o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.5); }
function snare(t){ let b=ctx.createBuffer(1,ctx.sampleRate*0.18,ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); let s=ctx.createBufferSource(); s.buffer=b; let g=ctx.createGain(); g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.3); s.connect(g); g.connect(masterGain); s.start(t); }
function hat(t,o=false){ let b=ctx.createBuffer(1,ctx.sampleRate*0.05,ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); let src=ctx.createBufferSource(); src.buffer=b; let f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=o?3500:8000; let g=ctx.createGain(); g.gain.setValueAtTime(o?0.35:0.28,t); g.gain.exponentialRampToValueAtTime(0.01,t+(o?0.25:0.07)); src.connect(f); f.connect(g); g.connect(masterGain); src.start(t); }
function bass(t,f){ if(!isFinite(f)) return; let o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.8); o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.85); }
function lead(t,f,v=0.4){ if(!isFinite(f)) return; let o=ctx.createOscillator(),g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=rnd(-4,4); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.5); o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.6); }

async function bufferSong(){
  document.getElementById('status').innerText='🧠 CONDUCTOR buffering 4 sections...';
  log('BUFFERING 4 sections');
  let res=await fetch('/api/conductor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({genre:GENRE,prompt:document.getElementById('prompt').value,session,need:4})});
  let data=await res.json();
  if(!session) session=data.lock;
  else session={...session,...data.lock};
  sections=data.sections;
  sectionIdx=0; barCount=0;
  log(`LOCKED ${session.key} ${session.bpm} BPM | Buffered ${sections.length}`);
  document.getElementById('status').innerText=`♪ ${session.key} | ${session.bpm} BPM | Buffered ${sections.length} sections`;
  return true;
}

async function needMore(){
  if(sections.length - sectionIdx <2){
    log('Low buffer, fetching 2 more');
    let res=await fetch('/api/conductor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({genre:GENRE,prompt:document.getElementById('prompt').value,session,need:2})});
    let data=await res.json(); sections.push(...data.sections); log(`+2 buffered total ${sections.length}`);
  }
}

function scheduler(){
  if(!session||!sections.length) return;
  let cur=sections[sectionIdx];
  let base=60/session.bpm/4;
  while(nextNote < ctx.currentTime+0.25){
    let s=step%16;
    let t=nextNote;
    let prog=session.prog; let chordIdx=prog[Math.floor(s/4)%prog.length]; let root=session.scale[chordIdx%session.scale.length];
    if(cur.kick?.[s]) kick(t);
    if(cur.snare?.[s]) snare(t);
    if(cur.hat?.[s]) hat(t,false);
    if(cur.bass?.[s]) bass(t,root);
    let m=cur.melody?.[s]; if(m && m.n!=null){ let f=session.scale[m.n%session.scale.length]*2; lead(t,f,m.v||0.5); }
    bars.forEach((b,i)=> b.style.height= i%16===s? '44px': rnd(4,14)+'px');
    nextNote+=base; step=(step+1)%16;
    if(step===0){
      barCount++;
      if(barCount%4===0){
        sectionIdx=(sectionIdx+1)%sections.length;
        document.getElementById('status').innerText=`♪ ${session.key} | ${session.bpm} BPM | ${cur.id||sectionIdx} | buf:${sections.length-sectionIdx}`;
        if(sections.length-sectionIdx<2) needMore();
      }
    }
  }
  timer=setTimeout(scheduler,25);
}

async function toggle(){
  initAudio();
  if(!playing){
    document.getElementById('btn').innerText='⏳ BUFFERING...';
    await bufferSong();
    playing=true; nextNote=ctx.currentTime+0.1; step=0; scheduler();
    document.getElementById('btn').innerText='■ STOP DUAL ENGINE';
    askCreativeAuto('Song started! Explain what we are playing in a cool way');
  }else{
    playing=false; clearTimeout(timer); document.getElementById('btn').innerText='▶ BUFFER & PLAY';
  }
}
async function askCreative(){
  let q=document.getElementById('chatInput').value; if(!q) return;
  document.getElementById('chatInput').value='';
  let box=document.getElementById('chatBox'); box.innerText='⚡ Thinking...';
  let res=await fetch('/api/creative',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,genre:GENRE,session})});
  let data=await res.json(); box.innerText=data.a;
  // اگه گفت darker / funky -> پرامپت رو اپدیت کن
  if(q.toLowerCase().includes('darker')||q.toLowerCase().includes('funk')||q.toLowerCase().includes('more')){ document.getElementById('prompt').value+=' '+q; log('Prompt updated: '+q); }
}
async function askCreativeAuto(q){
  let box=document.getElementById('chatBox'); box.innerText='⚡...';
  let res=await fetch('/api/creative',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,genre:GENRE,session})});
  let data=await res.json(); box.innerText=data.a;
}
log('DUAL BRAIN READY');
</script>
</body>
</html>
